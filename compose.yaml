name: ai-data-analyst-agent

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ai-data-analyst-agent-streamlit:latest
    container_name: ai-data-analyst-app
    env_file:
      - .env
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: "none"
      STREAMLIT_SERVER_BASE_URL_PATH: "data-analysis"
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
    ports:
      - "127.0.0.1:${STREAMLIT_HOST_PORT:-8601}:8501"
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    tmpfs:
      - /tmp:size=256m,mode=1777
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/data-analysis/_stcore/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    container_name: ai-data-analyst-caddy
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-http://:80}"
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://app:8501/data-analysis/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uploads:
  outputs:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
    name: public-proxy
